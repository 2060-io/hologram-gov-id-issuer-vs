# Default values for issuer-vs chart
# If you want to use this chart, you can change the values below
# and then run `helm upgrade --install chart/ --namespace my-namespace
# Update namespaces, domains, and other values as needed.
# You can also enable the vs-agent-chart, vision-matcher-chart, vision-service-chart, and webrtc-server-chart
# by setting the corresponding values to true.
global:
  domain: demos.2060.io # Global domain for the chart, used for ingress and other services

name: issuer-vs
replicas: 1
database:
  host: issuer
  user: govidissuer
  # Use either 'pwd' (plain text, not recommended for production) or 'existingSecret'
  # pwd: mypassword123
  existingSecret: ""    # Name of an existing K8s Secret with key POSTGRES_PASSWORD
  existingSecretKey: POSTGRES_PASSWORD

image:
  repository: ""
  # Tag defaults to Chart.Version if not specified
  tag: ""

ingress:
  host: "{{ .Values.name }}.{{ .Values.global.domain }}"
  tlsSecret: public.{{ .Values.name }}.{{ .Values.global.domain }}-cert

backend:
  webrtc: https://webrtc.{{ .Values.global.domain }} # URL for the webrtc server
  vision: https://vision.{{ .Values.global.domain }} # URL for the vision service
  vsAgentAdminUrl: http://issuer:3000 # URL for the vs-agent v2 Admin API (the client appends /v2)
  port: 2903 # Port for the backend service
  timeout: 900 # Timeout for ID verification in seconds, defined in the backend service for resetting the ID verification process
  logLevel: 3 # Log level for the backend service, default only errors are logged, set to 3 for debug logs
  # Identifier (URL) of the JSON Schema Credential (VTJSC) of the passport credential schema, published by the
  # ecosystem that owns the schema. The VS Agent must hold an ISSUER participant for it. The backend creates the
  # AnonCreds credential definition for this VTJSC at startup when none exists. Required.
  jsonSchemaCredentialId: ""
  # Optional: shared secret of the events webhook. When set, the backend rejects event deliveries without
  # "Authorization: Bearer <key>". Set the same secret as EVENTS_WEBHOOK_API_KEY in vs-agent-chart.extraEnv.
  eventsWebhookApiKey:
    existingSecret: "" # Name of an existing K8s Secret holding the key
    existingSecretKey: EVENTS_WEBHOOK_API_KEY

# If you want to use the issuer-vs chart, you can enable it by setting the following:
# vs-agent-chart.enabled: true
# The v2 chart needs the Verana network values and the VERANA_ACCOUNT_MNEMONIC secret: the agent refuses to
# start without them. See https://github.com/verana-labs/vs-agent/tree/main/charts/vs-agent
vs-agent-chart:
  enabled: false
  name: issuer
  # The passport flow needs the MRTD protocol: use the vs-agent-mrtd image (chat + mrtd plugins)
  image:
    repository: veranalabs/vs-agent-mrtd
    tag: v2.0.0-dev.105
  # Events webhook: the agent posts every event envelope to the backend's POST /events.
  # Rendered in the subchart context, so spell out the backend service (name) and port (backend.port).
  eventsWebhookUrl: "http://issuer-vs:2903/events"
  ingress:
    host: "{{ .Values.name }}.{{ .Values.global.domain }}" # Host for the vs agent service
    tlsSecret: public.{{ .Values.name }}.{{ .Values.global.domain }}-cert # TLS secret for the vs agent service

  # The backend calls the Admin API from another pod. In adminApiAuthMode "internal" the agent answers 403 to
  # every caller outside these CIDR blocks (default 127.0.0.0/8,::1/128). Set the pod CIDR of your cluster here,
  # and keep the source address of any public ingress outside it. Required for the backend to work.
  adminApiTrustedNetworks: ""

  # Verana network (required by the agent)
  veranaCorporationId: "" # VPR Corporation.id of the corporation that operates this agent
  veranaRpcEndpointUrl: "" # e.g. "https://rpc.testnet.verana.network"
  veranaIndexerBaseUrl: "" # e.g. "https://idx.testnet.verana.network"
  veranaChainId: "" # e.g. the chain id of the network above
  trustedEcsEcosystemDids: "" # Comma-separated ECS ecosystem DIDs (agentMode standalone)

  # PostgreSQL sidecar; the backend also uses it (database.host above points to the vs-agent service)
  database:
    enabled: false # Set to true if you want to use a database
    user: govidissuer
    existingSecret: custom-secrets
    secretPwdKey: POSTGRES_PASSWORD

  # Recomended extra environment variables for the vs-agent
  # to work with the issuer-vs chart
  extraEnv:
    - name: VERANA_ACCOUNT_MNEMONIC
      valueFrom:
        secretKeyRef:
          name: custom-secrets
          key: VERANA_ACCOUNT_MNEMONIC
    - name: POSTGRES_HOST
      value: "localhost"
    - name: POSTGRES_USER
      value: "govidissuer"
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: custom-secrets
          key: POSTGRES_PASSWORD
    # uncomment to authenticate event deliveries (same secret as backend.eventsWebhookApiKey)
    # - name: EVENTS_WEBHOOK_API_KEY
    #   valueFrom:
    #     secretKeyRef:
    #       name: custom-secrets
    #       key: EVENTS_WEBHOOK_API_KEY

# If you want to use the vision-service chart, you can enable it by setting the following:
# vision-service-chart.enabled: true
vision-service-chart:
  enabled: false
  app:
    name: vision-service

  # Ingress configuration
  ingress:
    name: vision-service-demos-ingress
    host: vision.{{ .Values.global.domain }}
    tlsSecret: vision.{{ .Values.global.domain }}-cert

  statefulset:
    name: vision-service
    serviceName: vision-service
    replicas: 1
    containerName: vision-service
    pullPolicy: Always
    storage: 1Gi
    env:
      HOST: "0.0.0.0"
      NUMBER_OF_GESTURES_TO_REQUEST: "2"
      USE_MEDIASOUP_ICE_RELAY: "false"
      VISION_MATCHER_BASE_URL: "http://vision-matcher-service.default:5123"
      ENABLE_DEBUG_ENDPOINTS: "false"

  service:
    name: vision-service
    ports: 5000

  # If you want to use the vision-matcher chart, you can enable it by setting the following:
  # vision-matcher-chart.enabled: true
  vision-matcher-chart:
    enabled: false
    app:
      name: vision-matcher

    statefulset:
      name: vision-matcher
      serviceName: vision-matcher
      replicas: 1
      containerName: vision-matcher
      pullPolicy: Always
      storage: 1Gi

    service:
      name: vision-matcher-service
      ports:
        redis: 5123

# If you want to use the webrtc-server chart, you can enable it by setting the following:
# webrtc-server-chart.enabled: true
webrtc-server-chart:
  enabled: false
  service:
    name: webrtc-demos-service
  ingress:
    name: webrtc-demos-ingress
    host: webrtc.{{ .Values.global.domain }}
    tlsSecret: webrtc.{{ .Values.global.domain }}-cert
    loadBalancerMode: false
  app:
    name: webrtc-demos
  statefulset:
    name: webrtc-demos
    serviceName: "webrtc-demos-service"
    replicas: 1
    containerName: webrtc-demos-container
    pullPolicy: Always
    storage: 1Gi
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  env:
    LOG_LEVEL: "3"
    DEBUG: "*mediasoup* *INFO* *WARN* *ERROR*"
    PROTOO_LISTEN_PORT: "4443"
    MEDIASOUP_CLIENT_PROTOOPORT: "443"
    MEDIASOUP_CLIENT_ENABLE_ICESERVER: "yes"
    MEDIASOUP_CLIENT_ICESERVER_HOST: "xxx.xxx.xxx.xxx"
    MEDIASOUP_CLIENT_ICESERVER_PROTO: "udp"
    MEDIASOUP_CLIENT_ICESERVER_PORT: "3478"
    MEDIASOUP_CLIENT_ICESERVER_USER: "user"
    MEDIASOUP_CLIENT_ICESERVER_PASS: "password"
    MEDIASOUP_INGRESS_HOST: "webrtc.{{ .Values.global.domain }}"
    HTTPS_CERT_FULLCHAIN: "/config/certificates/tls.crt"
    HTTPS_CERT_PRIVKEY: "/config/certificates/tls.key"
  secret:
    name: "webrtc.{{ .Values.global.domain }}-cert"
